name: Vigia iPhone 18 Pro Max

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar só uma notificação de teste"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador (a lista de iPhones da NOS é carregada por JavaScript)
        if: ${{ !inputs.teste }}
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Verificar stock na NOS
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODELO: ${{ vars.MODELO }}
          CAPACIDADE: ${{ vars.CAPACIDADE }}
          CORES: ${{ vars.CORES }}
          URLS_EXTRA: ${{ vars.URLS_EXTRA }}
          INCLUIR_CAIXA_ABERTA: ${{ vars.INCLUIR_CAIXA_ABERTA }}
          TESTE: ${{ inputs.teste && '1' || '0' }}
        run: python vigia.py

      - name: Guardar estado (evita notificações repetidas)
        if: ${{ !inputs.teste }}
        run: |
          if ! git diff --quiet -- state.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard state.json)" ]; then
            git config user.name "vigia-bot"
            git config user.email "vigia-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Atualizar estado do vigia"
            git push
          fi
